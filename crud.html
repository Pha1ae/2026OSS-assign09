<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="container py-4">
    <h1 class="mb-4">Book Management</h1>

    <h2>Add / Update Book</h2>
    <form id="bookForm" class="mb-4">
        <input type="text" id="title" class="form-control mb-2" placeholder="Title" required>
        <input type="text" id="author" class="form-control mb-2" placeholder="Author" required>
        <input type="text" id="genre" class="form-control mb-2" placeholder="Genre" required>
        <input type="number" id="year" class="form-control mb-2" placeholder="Year" required>
        <input type="number" id="rating" class="form-control mb-2" placeholder="Rating (1-5)" min="1" max="5" required>

        <button type="submit" id="add" class="btn btn-primary">Add Book</button>
    </form>

    <h2>Search Books</h2>
    <input type="search" id="searchInput" class="form-control mb-3" placeholder="Search by title">

    <p id="errorMessage" class="text-danger"></p>
    <ul id="bookList" class="list-group"></ul>

    <script src="crud.js"></script>
</body>

</html>
